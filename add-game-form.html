<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add videogame</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% include 'navigation.html' %}
<main class="container py-4">
    <h1>Add a videogame</h1>
    <form action="add-game.php" method="post" class="mt-3" style="max-width: 40rem">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3"><label class="form-label" for="GameName">Game name</label>
            <input required maxlength="150" class="form-control" id="GameName" name="GameName"></div>
        <div class="mb-3"><label class="form-label" for="GameDescription">Description</label>
            <textarea required maxlength="5000" class="form-control" id="GameDescription" name="GameDescription" rows="5"></textarea></div>
        <div class="mb-3"><label class="form-label" for="DateReleased">Date released</label>
            <input required type="date" class="form-control" id="DateReleased" name="DateReleased"></div>
        <div class="mb-3"><label class="form-label" for="GameRating">Rating (0-10)</label>
            <input required min="0" max="10" type="number" class="form-control" id="GameRating" name="GameRating"></div>
        <button class="btn btn-primary" type="submit">Add game</button>
    </form>
</main>
</body>
</html>
