<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Videogame catalogue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% include 'navigation.html' %}
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Videogame catalogue</h1><a class="btn btn-primary" href="add-game-form.php">Add game</a>
    </div>
    <form class="row g-2 mb-4" method="get" action="list-games.php">
        <div class="col-md-4 position-relative">
            <label class="visually-hidden" for="name">Search games</label>
            <input autocomplete="off" class="form-control" id="name" name="name" value="{{ name }}" placeholder="Search by name">
            <div id="suggestions" class="list-group position-absolute w-100" style="z-index:2"></div>
        </div>
        <div class="col"><input class="form-control" type="number" name="from_year" value="{{ from_year }}" placeholder="From year" min="1900" max="2100"></div>
        <div class="col"><input class="form-control" type="number" name="to_year" value="{{ to_year }}" placeholder="To year" min="1900" max="2100"></div>
        <div class="col"><input class="form-control" type="number" name="min_rating" value="{{ min_rating }}" placeholder="Min rating" min="0" max="10"></div>
        <div class="col-auto"><button class="btn btn-secondary" type="submit">Search</button></div>
    </form>
    <p>{{ games|length }} record(s) found.</p>
    <div class="table-responsive"><table class="table table-striped">
        <thead><tr><th>Name</th><th>Released</th><th>Rating</th><th>Actions</th></tr></thead>
        <tbody>
        {% for game in games %}
            <tr>
                <td><a href="game-details.php?id={{ game.game_id }}">{{ game.game_name }}</a></td>
                <td>{{ game.released_date }}</td><td>{{ game.rating }}/10</td>
                <td><a href="edit-game.php?id={{ game.game_id }}">Amend</a></td>
            </tr>
        {% else %}
            <tr><td colspan="4">No games found.</td></tr>
        {% endfor %}
        </tbody>
    </table></div>
</main>
<script>
const input = document.getElementById('name');
const suggestions = document.getElementById('suggestions');
let timer;
input.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
        const response = await fetch(`ajax.php?search=${encodeURIComponent(input.value)}`);
        const games = await response.json();
        suggestions.replaceChildren(...games.map(game => {
            const link = document.createElement('a');
            link.className = 'list-group-item list-group-item-action';
            link.href = `game-details.php?id=${encodeURIComponent(game.game_id)}`;
            link.textContent = game.game_name;
            return link;
        }));
    }, 200);
});
</script>
</body>
</html>
