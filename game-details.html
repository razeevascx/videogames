<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ game.game_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% include 'navigation.html' %}
<main class="container py-4">
    <a href="list-games.php">← Back to list</a>
    <h1 class="mt-4">{{ game.game_name }}</h1>
    <p>{{ game.game_description|nl2br }}</p>
    <p><strong>Released:</strong> {{ game.released_date }} · <strong>Rating:</strong> {{ game.rating }}/10</p>
    <a class="btn btn-outline-primary" href="edit-game.php?id={{ game.game_id }}">Amend game</a>
    <form class="d-inline" method="post" action="delete-game.php" onsubmit="return confirm('Delete this game?')">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="id" value="{{ game.game_id }}">
        <button class="btn btn-outline-danger" type="submit">Delete</button>
    </form>
</main>
</body>
</html>
